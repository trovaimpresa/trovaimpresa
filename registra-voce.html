<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Registra la voce dei video — TrovaImpresa</title>
<!-- 8 nov 2026 — Pagina di lavoro di Alessio: legge le frasi dei video tutorial
     del gestionale e registra la sua voce, una frase alla volta.
     Le frasi vengono da /video/tutorial/frasi.json (lo fa tools/tutorial/frasi.py).
     Le registrazioni restano in QUESTO browser (IndexedDB) finche' non le scarica:
     si puo' fare un po' oggi e un po' domani. Il pacchetto voce-tutorial.zip
     lo usa tools/tutorial/registra.py per rifare i video con la sua voce.
     Non e' collegata da nessuna parte e non scrive niente sul server. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#e7eef8;color:#0a2a4d}
  header{background:#0a2a4d;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:40px 40px;color:#fff;padding:22px 20px}
  header h1{margin:0;font-size:28px;font-weight:800}
  header p{margin:6px 0 0;font-size:19px;opacity:.9}
  main{max-width:900px;margin:0 auto;padding:20px}
  .barra{height:14px;background:#cfdcee;border-radius:8px;overflow:hidden;margin:6px 0 4px}
  .barra i{display:block;height:100%;background:#0a2a4d;width:0}
  .conto{font-size:19px;font-weight:700}
  .carta{background:#fff;border:2px solid #0a2a4d;border-radius:16px;padding:26px 24px;margin:18px 0}
  .video{font-size:18px;font-weight:700;color:#475569;margin-bottom:10px}
  .frase{font-size:36px;font-weight:800;line-height:1.3;min-height:3em}
  .stato{font-size:20px;font-weight:700;margin-top:14px;min-height:1.4em}
  .stato.rec{color:#c62828}
  .tasti{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
  button{font:inherit;cursor:pointer;border-radius:14px;min-height:64px;padding:0 26px;font-size:22px;font-weight:800}
  .rec{background:#c62828;color:#fff;border:2px solid #c62828;flex:1}
  .rec.on{background:#0a2a4d;border-color:#0a2a4d}
  .sec{background:#fff;color:#0a2a4d;border:2px solid #0a2a4d}
  .pic{min-height:52px;font-size:18px;padding:0 18px}
  .giu{background:#0a2a4d;color:#fff;border:2px solid #0a2a4d;width:100%}
  .nota{font-size:18px;line-height:1.5}
  .elenco{margin-top:10px;font-size:17px}
  .elenco div{padding:8px 4px;border-bottom:1px solid #cfdcee;cursor:pointer}
  .elenco div.ok::before{content:"✓ ";color:#2e7d32;font-weight:800}
  .elenco div.qui{background:#fff;font-weight:800}
  details summary{font-size:19px;font-weight:700;cursor:pointer;margin:10px 0}
  @media(max-width:600px){.frase{font-size:28px}button{font-size:20px}}
</style>
</head>
<body>
<header>
  <h1>Registra la tua voce</h1>
  <p>Premi «Registra», leggi la frase con calma, premi «Fatto».</p>
</header>
<main>
  <div class="conto" id="conto">…</div>
  <div class="barra"><i id="barra"></i></div>

  <div class="carta">
    <div class="video" id="video"></div>
    <div class="frase" id="frase">Carico le frasi…</div>
    <div class="stato" id="stato"></div>
    <div class="tasti">
      <button class="rec" id="b-rec">● Registra</button>
    </div>
    <div class="tasti">
      <button class="sec pic" id="b-ind">← Indietro</button>
      <button class="sec pic" id="b-asc">▶ Ascolta</button>
      <button class="sec pic" id="b-av">Salta →</button>
    </div>
  </div>

  <button class="giu" id="b-zip">Scarica le registrazioni</button>
  <p class="nota">Puoi fermarti quando vuoi: quello che hai registrato resta qui, su questo telefono o computer. Alla fine premi «Scarica le registrazioni» e mandami il file in chat.</p>

  <details>
    <summary>Tutte le frasi</summary>
    <div class="elenco" id="elenco"></div>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function () {
  var FRASI = [], qui = 0, clip = {}, db = null, rec = null, pezzi = [], flusso = null, audio = null;
  var $ = function (id) { return document.getElementById(id); };

  /* ---- il cassetto nel browser (IndexedDB): le registrazioni non si perdono ---- */
  function apriDb() {
    return new Promise(function (ok, ko) {
      var r = indexedDB.open("voce-tutorial", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("clip"); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { ko(r.error); };
    });
  }
  function salvaClip(id, blob) {
    return new Promise(function (ok) {
      var t = db.transaction("clip", "readwrite"); t.objectStore("clip").put(blob, id);
      t.oncomplete = ok; t.onerror = ok;
    });
  }
  function leggiTutte() {
    return new Promise(function (ok) {
      var out = {}, t = db.transaction("clip"), s = t.objectStore("clip"), c = s.openCursor();
      c.onsuccess = function () { var x = c.result; if (x) { out[x.key] = x.value; x.continue(); } else ok(out); };
      c.onerror = function () { ok(out); };
    });
  }

  function mostra() {
    var f = FRASI[qui]; if (!f) return;
    var fatte = FRASI.filter(function (x) { return clip[x.id]; }).length;
    $("conto").textContent = fatte + " frasi registrate su " + FRASI.length;
    $("barra").style.width = Math.round(100 * fatte / FRASI.length) + "%";
    $("video").textContent = "Video: " + f.titolo + "  ·  frase " + (qui + 1) + " di " + FRASI.length;
    $("frase").textContent = f.testo;
    $("stato").className = "stato";
    $("stato").textContent = clip[f.id] ? "✓ Già registrata. Puoi rifarla." : "";
    $("b-asc").disabled = !clip[f.id];
    $("b-ind").disabled = qui === 0;
    var el = $("elenco");
    Array.prototype.forEach.call(el.children, function (d, i) {
      d.className = (clip[FRASI[i].id] ? "ok" : "") + (i === qui ? " qui" : "");
    });
  }
  function disegnaElenco() {
    $("elenco").innerHTML = "";
    FRASI.forEach(function (f, i) {
      var d = document.createElement("div"); d.textContent = f.testo;
      d.onclick = function () { if (!rec) { qui = i; mostra(); window.scrollTo(0, 0); } };
      $("elenco").appendChild(d);
    });
  }
  function prossimaDaFare(da) {
    for (var i = da; i < FRASI.length; i++) if (!clip[FRASI[i].id]) return i;
    for (i = 0; i < FRASI.length; i++) if (!clip[FRASI[i].id]) return i;
    return Math.min(da, FRASI.length - 1);
  }

  /* ---- registrare ---- */
  function tipo() {
    var t = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"];
    for (var i = 0; i < t.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t[i])) return t[i];
    return "";
  }
  async function inizia() {
    if (audio) audio.pause();
    try {
      if (!flusso) flusso = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      $("stato").textContent = "Non riesco a usare il microfono. Premi «Consenti» quando il telefono lo chiede.";
      return;
    }
    pezzi = [];
    var t = tipo();
    rec = t ? new MediaRecorder(flusso, { mimeType: t }) : new MediaRecorder(flusso);
    rec.ondataavailable = function (e) { if (e.data && e.data.size) pezzi.push(e.data); };
    rec.onstop = async function () {
      var f = FRASI[qui], b = new Blob(pezzi, { type: rec.mimeType || "audio/webm" });
      rec = null;
      $("b-rec").classList.remove("on"); $("b-rec").textContent = "● Registra";
      if (b.size < 2000) { $("stato").textContent = "Troppo corta, riprova."; return; }
      clip[f.id] = b; await salvaClip(f.id, b);
      qui = prossimaDaFare(qui + 1);
      mostra();
      $("stato").textContent = "✓ Salvata. Ecco la prossima.";
    };
    rec.start();
    $("b-rec").classList.add("on"); $("b-rec").textContent = "■ Fatto";
    $("stato").className = "stato rec"; $("stato").textContent = "● Sto registrando… leggi la frase";
  }
  $("b-rec").onclick = function () { if (rec) rec.stop(); else inizia(); };
  $("b-av").onclick = function () { if (rec) return; qui = Math.min(qui + 1, FRASI.length - 1); mostra(); };
  $("b-ind").onclick = function () { if (rec) return; qui = Math.max(qui - 1, 0); mostra(); };
  $("b-asc").onclick = function () {
    var b = clip[FRASI[qui].id]; if (!b) return;
    if (audio) audio.pause();
    audio = new Audio(URL.createObjectURL(b)); audio.play();
  };

  /* ---- scaricare tutto in un file solo ---- */
  $("b-zip").onclick = async function () {
    var ids = Object.keys(clip);
    if (!ids.length) { alert("Non hai ancora registrato nessuna frase."); return; }
    if (!window.JSZip) { alert("Manca un pezzo della pagina: ricarica e riprova."); return; }
    $("b-zip").textContent = "Preparo il file…";
    var z = new JSZip(), indice = [];
    ids.forEach(function (id) {
      var b = clip[id], est = /mp4/.test(b.type) ? "m4a" : (/ogg/.test(b.type) ? "ogg" : "webm");
      var f = FRASI.filter(function (x) { return x.id === id; })[0];
      z.file(id + "." + est, b);
      indice.push({ id: id, file: id + "." + est, testo: f ? f.testo : "" });
    });
    z.file("indice.json", JSON.stringify(indice, null, 1));
    var blob = await z.generateAsync({ type: "blob" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "voce-tutorial.zip";
    document.body.appendChild(a); a.click(); a.remove();
    $("b-zip").textContent = "Scarica le registrazioni";
  };

  /* ---- partenza ---- */
  Promise.all([
    fetch("/video/tutorial/frasi.json", { cache: "no-cache" }).then(function (r) { return r.json(); }),
    apriDb()
  ]).then(async function (r) {
    FRASI = r[0]; db = r[1];
    clip = await leggiTutte();
    disegnaElenco();
    qui = prossimaDaFare(0);
    mostra();
  }).catch(function () { $("frase").textContent = "Non riesco a caricare le frasi. Ricarica la pagina."; });
})();
</script>
</body>
</html>

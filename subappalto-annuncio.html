<style>
.sa-wrap{max-width:880px;margin:0 auto;padding:22px 18px 60px}
.sa-briciole{font-size:.86rem;color:#5b6b7c;margin-bottom:16px}
.sa-briciole a{color:#0066ff;text-decoration:none}
.sa-briciole a:hover{text-decoration:underline}
.sa-card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.08);border-top:4px solid #0066ff;padding:26px 26px 24px;margin-bottom:18px}
.sa-card.offre{border-top-color:#d4a017}
.sa-tag{display:inline-block;background:#e8f2ff;color:#0047b3;border-radius:6px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-bottom:12px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const sb = supabase.createClient(
    'https://nacvrsgkyfavykxjxszu.supabase.co',
    'sb_publishable_TnPNRwYVQu3IlwY4GpZsUg_okv0sI0R'
  );
  const SITO = 'https://trovaimpresa.com';
  const box  = document.getElementById('sa-contenuto');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  /* Il testo dell'annuncio e' scritto a righe libere da chi pubblica.
     La prima riga fa da titolo; le righe che cominciano con una di queste
     etichette diventano riquadri o pastiglie; il resto resta descrizione. */
  function separa(testo){
    const righe = String(testo||'').split('\n').map(r=>r.trim()).filter(Boolean);
    const out = {titolo:'', corpo:[], periodo:'', budget:'', elenco:[], etichettaElenco:''};
    righe.forEach((r,idx)=>{
      const m = r.match(/^(Periodo|Budget|Requisiti|Certificazioni)\s*:\s*(.*)$/i);
      if(m){
        const k = m[1].toLowerCase(), v = m[2].trim();
        if(k==='periodo') out.periodo = v;
        else if(k==='budget') out.budget = v;
        else { out.elenco = v.split(',').map(x=>x.trim()).filter(Boolean);
               out.etichettaElenco = (k==='requisiti') ? 'Requisiti richiesti' : 'Certificazioni'; }
        return;
      }
      if(idx===0) out.titolo = r; else out.corpo.push(r);
    });
    return out;
  }

  function euro(v){
    const n = String(v||'').replace(/[^0-9]/g,'');
    return n ? Number(n).toLocaleString('it-IT') + ' €' : String(v||'');
  }

  function dataInParole(iso){
    if(!iso) return '';
    const d = new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'});
  }

  function nonTrovato(msg){
    box.innerHTML = '<div class="sa-card"><div class="sa-h1">Annuncio non disponibile</div>'
      + '<div class="sa-corpo">' + esc(msg) + '</div>'
      + '<div class="sa-meta"><a class="sa-btn" href="/subappalto.html">Vedi tutti i subappalti</a></div></div>';
  }

  async function carica(){
    const id = new URLSearchParams(location.search).get('id');
    if(!id || !/^[0-9]+$/.test(id)) return nonTrovato('Questo indirizzo non ha un numero di annuncio valido.');

    let r;
    try{
      r = await sb.from('subappalti')
            .select('id, tipo, nome_impresa, descrizione, lavoro, citta, regione, telefono, email, created_at')
            .eq('id', id).maybeSingle();
    }catch(e){ return nonTrovato('Non riesco a leggere l’annuncio in questo momento. Riprova fra poco.'); }
    if(r.error || !r.data) return nonTrovato('Questo annuncio non c’è più, oppure è stato tolto da chi l’aveva pubblicato.');

    const a = r.data;
    const cerca = a.tipo === 'cerca';
    const t = separa(cerca ? a.descrizione : a.lavoro);
    const titolo = t.titolo || (cerca ? 'Cerco subappaltatori' : 'Disponibile per subappalti');
    const luogo  = a.citta || a.regione || '';

    /* I meta: Google esegue il JavaScript, quindi li vede. Li scriviamo qui e
       non a mano nell'HTML perche' dipendono dall'annuncio. */
    const titoloPagina = titolo + (luogo ? ' — Subappalto a ' + luogo : ' — Subappalto') + ' | TrovaImpresa';
    let descr = (cerca ? 'Impresa cerca subappaltatori' : 'Impresa disponibile in subappalto')
              + (luogo ? ' a ' + luogo : '') + '. ' + (t.corpo.join(' ') || titolo);
    if(descr.length > 300) descr = descr.slice(0,297).replace(/\s+\S*$/,'') + '…';
    document.title = titoloPagina;
    const url = SITO + '/subappalto-annuncio?id=' + encodeURIComponent(a.id);
    const set = (id2, attr, val) => { const el = document.getElementById(id2); if(el) el.setAttribute(attr, val); };
    set('sa-desc','content',descr); set('sa-canonical','href',url);
    set('sa-ogurl','content',url); set('sa-ogtitle','content',titoloPagina); set('sa-ogdesc','content',descr);
    const br = document.getElementById('sa-briciola');
    if(br) br.textContent = '› ' + titolo;

    box.innerHTML =
      '<div class="sa-card' + (cerca ? '' : ' offre') + '">'
      + '<div class="sa-tag">' + (cerca ? '📋 Cerca subappaltatore' : '🙋 Disponibile per subappalti') + '</div>'
      + '<h1 class="sa-h1">' + esc(titolo) + '</h1>'
      + (a.nome_impresa ? '<div class="sa-impresa">' + esc(a.nome_impresa) + '</div>' : '')
      + (t.corpo.length ? '<div class="sa-corpo">' + esc(t.corpo.join('\n')) + '</div>' : '')
      + ((t.periodo || t.budget) ? '<div class="sa-fatti">'
          + (t.periodo ? '<div class="sa-fatto"><b>Periodo</b><span>' + esc(t.periodo) + '</span></div>' : '')
          + (t.budget  ? '<div class="sa-fatto"><b>Budget</b><span>' + esc(euro(t.budget)) + '</span></div>' : '')
          + '</div>' : '')
      + (t.elenco.length ? '<div class="sa-req"><b>' + esc(t.etichettaElenco) + '</b><ul>'
          + t.elenco.map(x => '<li>✓ ' + esc(x) + '</li>').join('') + '</ul></div>' : '')
      + '<div class="sa-meta">'
          + (luogo ? '<span>📍 ' + esc(luogo) + '</span>' : '')
          + (a.created_at ? '<span>🗓️ Pubblicato il ' + esc(dataInParole(a.created_at)) + '</span>' : '')
        + '</div>'
      + '</div>'
      + ((a.telefono || a.email) ?
          '<div class="sa-contatti"><h2>Contatta ' + esc(a.nome_impresa || 'l’impresa') + '</h2>'
          + (a.telefono ? '<a class="sa-btn" href="tel:' + esc(a.telefono) + '">📞 ' + esc(a.telefono) + '</a>' : '')
          + (a.email ? '<button class="sa-btn sec" id="sa-mostra-email" type="button">✉️ Mostra email</button><span id="sa-email"></span>' : '')
          + '</div>' : '')
      + '<div class="sa-fondo">Sei un’impresa e cerchi subappaltatori? <a href="/subappalto.html">Pubblica il tuo annuncio, è gratis</a></div>';

    /* L'email si monta solo al clic, e non e' mai presente nell'HTML di
       partenza: i raccoglitori di indirizzi leggono la pagina, non cliccano. */
    const bott = document.getElementById('sa-mostra-email');
    if(bott){
      const pezzi = String(a.email).split('@');
      bott.addEventListener('click', function(){
        const indirizzo = pezzi.join('@');
        const a2 = document.createElement('a');
        a2.className = 'sa-btn sec'; a2.href = 'mailto:' + indirizzo;
        a2.textContent = '✉️ ' + indirizzo;
        bott.replaceWith(a2);
      });
    }
  }

  carica();
})();
</script>

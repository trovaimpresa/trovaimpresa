/* 3 settembre 2026 — LA PAGINA PUBBLICA DELLE RECENSIONI DI UN'IMPRESA.
   Alessio: «la risposta e la recensione dovrebbero stare in un posto tutto
   loro e pubblico». Come Booking, Airbnb e TripAdvisor: la scheda mostra il

   l'impresa lo puo' mandare ai clienti («leggi cosa dicono di me»).
   Grafica: lo STILE e' copiato per intero da profilo-impresa.html (stessa
   testata blu, stesse carte, stesse stelle). Se cambi la scheda, rigenera
   anche questo <style>: e' lo stesso foglio senza i commenti.
   Dati: solo la funzione `recensioni_pubbliche()` del database (confermate,
   con `risposta_impresa`), come sulla scheda. */
(function(){
  try{
    var id=(new URLSearchParams(location.search).get('id')||'').trim();
    var lnk=document.querySelector('link[rel="canonical"]');
    if(/^[0-9]{1,12}$/.test(id)){ if(lnk)lnk.setAttribute('href','https://trovaimpresa.com/recensioni-impresa?id='+id); }
    else{ var m=document.createElement('meta');m.setAttribute('name','robots');m.setAttribute('content','noindex,follow');document.head.appendChild(m); }
  }catch(e){}
})();
</script>

        <button type="button" class="rec-condividi" onclick="condividiPagina()">🔗 Copia il link</button>
        <a class="btn-rec" id="btn-lascia" href="#" style="width:auto;display:inline-block;padding:10px 18px;text-decoration:none;font-size:15px">✍️ Lascia una recensione</a>

      <div class="rec-media"><div class="rec-media-n" id="rp-media">—</div><div class="rec-media-st" id="rp-stelle">☆☆☆☆☆</div><div class="rec-media-t" id="rp-tot">—</div></div>

      <button type="button" class="rec-filtro" data-f="5" onclick="cambiaFiltro('5',this)">Solo 5 ★</button>

<script>
const SU='https://nacvrsgkyfavykxjxszu.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hY3Zyc2dreWZhdnlreGp4c3p1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1OTczNTYsImV4cCI6MjA4OTE3MzM1Nn0.o5S0HeDtG-hlCo1zfk4ILqtog7MT8_2B0EyjdiVzBic';
function recEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
const ID=(new URLSearchParams(location.search).get('id')||'').trim();

async function avvia(){
  if(!/^[0-9]{1,12}$/.test(ID)){document.getElementById('rec-lista').innerHTML='<div class="rec-empty"><div class="rec-empty-icon">🔎</div><div class="rec-empty-title">Impresa non indicata</div><p class="rec-empty-sub">Apri questa pagina dalla scheda di un\'impresa.</p></div>';return;}
  document.getElementById('nav-back').href='profilo-impresa.html?id='+ID;
  document.getElementById('btn-lascia').href='profilo-impresa.html?id='+ID+'#recensioni';
  /* la stessa lettura pubblica della scheda: solo imprese vere e confermate */
  let d=null;
  try{
    const r=await fetch(`${SU}/rest/v1/imprese?id=eq.${ID}&is_test=eq.false&email_confermata=eq.true&select=id,nome,nome_attivita,tipo,citta,logo_url,foto_copertina_url,personalizzazione,piano&limit=1`,{headers:{'apikey':SK}});
    const j=await r.json(); d=Array.isArray(j)?j[0]:null;
  }catch(e){}
  if(!d){document.getElementById('profile-name').textContent='Impresa non trovata';document.getElementById('rec-lista').innerHTML='<div class="rec-empty"><div class="rec-empty-icon">🔎</div><div class="rec-empty-title">Impresa non trovata</div></div>';return;}
  const nome=String(d.nome_attivita||'').trim()||String(d.nome||'').trim()||'Impresa';
  document.title='Recensioni di '+nome+' — TrovaImpresa';
  document.getElementById('profile-name').textContent=nome;
  document.getElementById('profile-city').textContent='📍 '+(d.citta||'—');
  const tipoL={impresa:'🏗️ Impresa',artigiano:'🔧 Artigiano',negozio:'🏪 Negozio',professionista:'📐 Professionista'}[d.tipo]||'';
  document.getElementById('profile-tipo-badge').textContent=(tipoL?tipoL+' · ':'')+'Recensioni dei clienti';
  if(d.logo_url&&d.logo_url!=='/img/logo.png')document.getElementById('avatar-wrap').innerHTML=`<img src="${recEsc(d.logo_url)}" alt="logo">`;
  const cop=((d.personalizzazione||{}).banner_url)||d.foto_copertina_url||'';
  if(cop){const hc=document.getElementById('hero-cover');hc.style.backgroundImage=`url("${recEsc(cop)}")`;hc.classList.add('ha-copertina');}
  window._pianoImpresa=(d.piano||'free').toLowerCase();
  await caricaRecensioni(nome);
}

/* ---- ELENCO A PAGINE (3 set 2026) ----
   Riepilogo (media + barrette) da recensioni_riepilogo(); l'elenco arriva 10
   alla volta da recensioni_pubbliche_pag() col filtro scelto, cosi' con 200
   recensioni la pagina resta leggera. Ogni recensione e' compatta: i 4 voti su
   una riga sola, poi il testo e la risposta. */
const PASSO=10;
let _nome='', _filtro='tutte', _offset=0, _totFiltro=0, _isFree=false, _media=0, _totale=0;
async function rpc(nome,body){
  const r=await fetch(`${SU}/rest/v1/rpc/${nome}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null); return Array.isArray(j)?j:[];
}
function stelleTxt(n){n=Math.max(0,Math.min(5,Math.round(n||0)));return '★'.repeat(n)+'☆'.repeat(5-n);}

async function caricaRecensioni(nomeImpresa){
  _nome=nomeImpresa; _isFree=(window._pianoImpresa||'free')==='free';
  const rp=(await rpc('recensioni_riepilogo',{p_impresa_id:parseInt(ID)}))[0]||{};
  _totale=Number(rp.totale)||0; _media=parseFloat(rp.media)||0;
  document.getElementById('stat-rating').textContent=_media?_media.toFixed(1):'—';
  document.getElementById('stat-recensioni').textContent=_totale||'—';
  const div=document.getElementById('rec-lista');
  if(!_totale){
    div.style.display='none';
    document.getElementById('rec-vuoto').innerHTML=`<div class="rec-empty"><div class="rec-empty-icon">⭐</div><div class="rec-empty-title">Sii il primo a recensire ${recEsc(nomeImpresa)}</div><p class="rec-empty-sub">Hai lavorato con questa impresa? Racconta la tua esperienza e aiuta gli altri clienti.</p><a class="btn-rec rec-empty-btn" style="display:inline-block;width:auto;text-decoration:none" href="profilo-impresa.html?id=${ID}#recensioni">✍️ Lascia una recensione</a></div>`;
    return;
  }
  /* riepilogo */
  document.getElementById('rp-media').textContent=_media.toFixed(1);
  document.getElementById('rp-stelle').textContent=stelleTxt(_media);
  document.getElementById('rp-tot').textContent=_totale+(_totale===1?' recensione':' recensioni')+(rp.con_risposta?` · ${rp.con_risposta} con risposta`:'');
  document.getElementById('rp-barre').innerHTML=[5,4,3,2,1].map(k=>{const n=Number(rp['s'+k])||0;const pct=_totale?Math.round(n*100/_totale):0;
    return `<div class="rec-barra"><span>${k} ★</span><span class="tr"><i style="width:${pct}%"></i></span><span class="nn">${n}</span></div>`;}).join('');
  document.getElementById('rec-riepilogo').style.display='';
  document.getElementById('rec-filtri').style.display=_totale>3?'':'none';
  /* per Google */
  try{const ld={"@context":"https://schema.org","@type":"LocalBusiness","name":nomeImpresa,"url":"https://trovaimpresa.com/profilo-impresa?id="+ID,
      "aggregateRating":{"@type":"AggregateRating","ratingValue":_media.toFixed(1),"reviewCount":_totale,"bestRating":"5","worstRating":"1"}};
    const sc=document.createElement('script');sc.type='application/ld+json';sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);}catch(e){}
  await caricaPagina(true);
}

function cambiaFiltro(f,btn){
  _filtro=f; document.querySelectorAll('.rec-filtro').forEach(b=>b.classList.toggle('attivo',b===btn));
  caricaPagina(true);
}

async function caricaPagina(daCapo){
  const div=document.getElementById('rec-lista'); const btn=document.getElementById('rec-altre');
  if(daCapo){_offset=0;div.innerHTML='<div class="rec-nessuna">Carico…</div>';}
  btn.disabled=true;
  /* stessa regola della scheda: col piano Free si vedono le ultime 3 (e al cliente
     non si dice che ne mancano) */
  const limite=_isFree?3:PASSO;
  const righe=await rpc('recensioni_pubbliche_pag',{p_impresa_id:parseInt(ID),p_filtro:_filtro,p_limit:limite,p_offset:_offset});
  _totFiltro=righe.length?(Number(righe[0].totale_filtro)||righe.length):0;
  const html=righe.map(r=>{
    const quando=recEsc([r.mese_lavoro,r.anno_lavoro].filter(Boolean).join(' '));
    const voti=[['Qualità',r.stelle_qualita],['Puntualità',r.stelle_puntualita],['Prezzo',r.stelle_prezzo],['Professionalità',r.stelle_professionalita]]
      .filter(([,v])=>v!=null).map(([l,v])=>`${l} <b>${v}</b>`).join(' · ');
    const risp=r.risposta_impresa?`<div class="rec-risposta"><div class="rec-risposta-tit"><b>${recEsc(_nome)}</b> ha risposto a <b>${recEsc(r.nome_cliente)||'questo cliente'}</b>${r.risposta_il?` · ${new Date(r.risposta_il).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})}`:''}</div><p class="rec-risposta-testo">${recEsc(r.risposta_impresa)}</p></div>`:'';
    return `<div class="rec-item compatta${(r.voto||5)<=3?' critica':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="rec-nome">${recEsc(r.nome_cliente)||'Cliente'}${r.verificata?'<span class="rec-verif">✅ Verificata</span>':''}</span><span class="rec-data">${quando}</span></div><div class="rec-stelle">${stelleTxt(r.voto)} ${r.voto||'-'}/5</div><div class="rec-voti-riga">${voti}</div><p class="rec-testo">${recEsc(r.testo)}</p>${risp}</div>`;
  }).join('');
  if(daCapo){
    div.innerHTML=html||'<div class="rec-nessuna">Nessuna recensione con questo filtro.</div>';
  }else{ div.insertAdjacentHTML('beforeend',html); }
  _offset+=righe.length;
  const altre=!_isFree&&_offset<_totFiltro;
  btn.style.display=altre?'':'none';
  btn.textContent='Mostra altre '+Math.min(PASSO,_totFiltro-_offset);
  btn.disabled=false;
}
function caricaAltre(){ caricaPagina(false); }

function condividiPagina(){
  const url=location.origin+'/recensioni-impresa.html?id='+ID;
  const fine=()=>{const b=document.querySelector('.rec-condividi');if(b){const t=b.textContent;b.textContent='✅ Link copiato';setTimeout(()=>b.textContent=t,2500);}};
  if(navigator.share){navigator.share({title:document.title,url}).catch(()=>{});return;}
  if(navigator.clipboard){navigator.clipboard.writeText(url).then(fine).catch(()=>prompt('Copia questo indirizzo:',url));}else prompt('Copia questo indirizzo:',url);
}
avvia();
</script>

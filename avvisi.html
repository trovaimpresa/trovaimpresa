<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I tuoi avvisi — TrovaImpresa</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico">
  <!--
    avvisi.html — 27 ottobre 2026
    Ci arrivano i link delle email «avvisi clienti»:
      ?a=conferma&t=…  → attiva l'avviso (prima email dopo l'iscrizione)
      ?a=cancella&t=…  → spegne tutti gli avvisi di quella email
    Il lavoro lo fa netlify/functions/avvisi-gestione.js.
  -->
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a2a4d;
      background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
      background-size:40px 40px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .box{background:#fff;border-radius:22px;padding:48px 36px;max-width:600px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
    .logo{width:240px;max-width:75%;height:auto;margin:0 auto 28px;display:block}
    .cerchio{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;background:#ff8800}
    .cerchio svg{width:48px;height:48px;stroke:#fff}
    .cerchio.attesa{background:#e7eef8}
    .rotella{width:38px;height:38px;border:4px solid #c9d6e8;border-top-color:#0a2a4d;border-radius:50%;animation:gira .9s linear infinite}
    @keyframes gira{to{transform:rotate(360deg)}}
    h1{font-size:30px;color:#0a2a4d;margin-bottom:14px;line-height:1.25;font-weight:800}
    p{font-size:20px;color:#1f2d3d;line-height:1.5;margin-bottom:14px;font-weight:600}
    .cosa{display:inline-block;background:#e7eef8;border-left:5px solid #ff8800;border-radius:12px;padding:12px 16px;font-size:20px;font-weight:800;color:#0a2a4d;margin:4px 0 18px}
    .btn{display:inline-block;background:#ff8800;color:#fff;text-decoration:none;font-size:20px;font-weight:800;padding:16px 32px;border-radius:12px;margin-top:10px}
    @media(max-width:600px){.box{padding:34px 20px}h1{font-size:25px}p,.cosa{font-size:18px}}
  </style>
</head>
<body>
  <div class="box">
    <a href="/"><img class="logo" src="/img/trovaimpresa-logo.svg" alt="TrovaImpresa"></a>
    <div id="stato">
      <div class="cerchio attesa"><div class="rotella"></div></div>
      <h1>Un attimo…</h1>
    </div>
  </div>
<script>
(function () {
  var q = new URLSearchParams(location.search), a = q.get('a'), t = q.get('t');
  var el = document.getElementById('stato');
  var SPUNTA = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var CAMPANA = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="M3 3l18 18"/></svg>';
  var ESC = function (s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function mostra(ico, titolo, corpo) { el.innerHTML = '<div class="cerchio">' + ico + '</div><h1>' + titolo + '</h1>' + corpo; }
  function errore(msg) {
    mostra(CAMPANA, 'Questo link non funziona', '<p>' + ESC(msg || 'Il link non è valido.') + '</p><a class="btn" href="/cerca-imprese.html">Torna a cercare</a>');
  }
  if (!t || (a !== 'conferma' && a !== 'cancella')) return errore();
  fetch('/.netlify/functions/avvisi-gestione', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a: a, t: t }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) return errore(j.error);
      if (a === 'conferma') {
        mostra(SPUNTA, 'Avvisi attivi!',
          '<p>Quando arriva qualcuno di nuovo ti scriviamo noi:</p><div class="cosa">' + ESC(j.cosa) + '</div>' +
          '<p>Intanto puoi guardare chi c’è già.</p><a class="btn" href="/' + (j.origine && /^[a-z0-9-]+$/.test(j.origine) ? j.origine : (({ artigiano: 'cerca-artigiani.html', professionista: 'cerca-professionisti.html' }[j.tipo] || 'cerca-imprese.html') + '?citta=' + encodeURIComponent(j.citta || ''))) + '">Cerca adesso</a>');
      } else {
        mostra(CAMPANA, 'Fatto, niente più avvisi',
          '<p>Non ti scriveremo più. Se cambi idea, ti basta iscriverti di nuovo dalla ricerca.</p><a class="btn" href="/">Vai su TrovaImpresa</a>');
      }
    })
    .catch(function () { errore('Problema di connessione. Riprova fra poco.'); });
})();
</script>
</body>
</html>

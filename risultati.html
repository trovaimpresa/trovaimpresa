<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ricerca — TrovaImpresa</title>
<link rel="canonical" href="https://trovaimpresa.com/cerca-imprese">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:#f7f8fa;color:#1a1a1a;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;text-align:center}
  .box{background:#fff;border-radius:16px;padding:32px 28px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:460px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:16px;line-height:1.6;color:#555;margin:0 0 20px}
  a{display:inline-block;background:#0066ff;color:#fff;text-decoration:none;font-weight:700;
    font-size:16px;padding:14px 22px;border-radius:12px}
</style>
</head>
<body>
<!-- Questa pagina non fa più la ricerca: mostrava le imprese di tutta Italia
     ignorando la città, con filtri che non filtravano. Ora accompagna il
     visitatore sulla pagina di ricerca giusta, tenendo città e mestiere. -->
<div class="box">
  <h1>Ti porto ai risultati…</h1>
  <p id="msg">Un attimo solo.</p>
  <a id="vai" href="cerca-imprese.html">Vai alla ricerca →</a>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  var tipo = (p.get('tipo') || '').toLowerCase();
  var PAGINE = {
    artigiano: 'cerca-artigiani.html',
    artigiani: 'cerca-artigiani.html',
    impresa: 'cerca-imprese.html',
    imprese: 'cerca-imprese.html',
    negozio: 'cerca-negozi.html',
    negozi: 'cerca-negozi.html',
    professionista: 'cerca-professionisti.html',
    professionisti: 'cerca-professionisti.html'
  };
  var pagina = PAGINE[tipo] || 'cerca-imprese.html';

  /* la città arriva dall'indirizzo oppure da quella già scelta prima */
  var citta = p.get('citta') || '';
  if (!citta) { try { citta = localStorage.getItem('ti_citta_scelta') || ''; } catch(e){} }

  var q = [];
  if (citta) q.push('citta=' + encodeURIComponent(citta));
  if (p.get('mestiere')) q.push('mestiere=' + encodeURIComponent(p.get('mestiere')));
  if (p.get('regione')) q.push('regione=' + encodeURIComponent(p.get('regione')));
  var url = pagina + (q.length ? '?' + q.join('&') : '');

  document.getElementById('vai').href = url;
  if (citta) document.getElementById('msg').textContent = 'Sto aprendo la ricerca su ' + citta + '.';
  location.replace(url);
})();
</script>
</body>
</html>

# ===== 18 agosto 2026 — «VOGLIO CONTATTARLO» =====
# Il pulsante dentro l'email che arriva all'impresa. Indirizzo corto perche'
# finisce dentro un'email: /.netlify/functions/... si legge male e certi
# programmi di posta lo spezzano a meta'.
# ⚠️ Sta DOPO i blocchi qui sopra ma prima di tutto il resto: nessuno di
#    quelli combacia con questo indirizzo, quindi non si pestano i piedi.
[[redirects]]
  from = "/prendi-richiesta"
  to = "/.netlify/functions/prendi-richiesta"
  status = 200
  force = true

[[redirects]]
  from = "/gestionale"
  to = "/gestionale-invito.html"
  status = 302

[[redirects]]
  from = "/registrazione.html"
  to = "/#registrati"
  status = 301
  force = true

# ===== 16 agosto 2026 — DUE PAGINE MORTE CHE FACEVANO 404 =====
# Trovate in Search Console. Nessuna pagina del sito le linka: chi ci arriva
# viene da fuori (vecchie email, o la memoria di Google).
# Il rinvio per "registrazione.html" c'era gia', ma quello SENZA .html era
# rimasto scoperto: Google lo visitava ancora il 2 agosto.
[[redirects]]
  from = "/registrazione"
  to = "/#registrati"
  status = 301
  force = true

# "disdetta.html" era il link per cancellarsi dalle email. Oggi quella pagina
# si chiama cancella-iscrizione.html. Un link di disdetta rotto e' la cosa
# peggiore da lasciare cosi': chi vuole andarsene deve poterlo fare.
[[redirects]]
  from = "/disdetta.html"
  to = "/cancella-iscrizione.html"
  status = 301
  force = true

[[redirects]]
  from = "/disdetta"
  to = "/cancella-iscrizione.html"
  status = 301
  force = true


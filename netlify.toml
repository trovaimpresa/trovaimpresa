# ======================================================================
# 21 agosto 2026 — UNA PAGINA, UN INDIRIZZO SOLO
# ======================================================================
# Le pagine citta' stavano su Google in DUE indirizzi: /imprese-bologna e
# /imprese-bologna.html. Il canonical di ogni pagina ha sempre detto quello
# senza «.html», ma il sito stesso linkava l'altro: 216 link dentro le
# diciotto guide «quanto costa…», che sono le pagine con piu' visite.
# Google le ha prese per due pagine diverse e si e' diviso i voti fra le
# due: su Bologna la «.html» stava in posizione 44 con 22 impressioni,
# quella giusta in posizione 1 con 1 impressione.
#
# I 216 link sono stati sistemati nelle guide. Queste regole servono per
# quello che Google ha GIA' in pancia: chi arriva sulla «.html» viene
# mandato una volta per sempre su quella giusta.
#
# ⚠️ force = true e' obbligatorio: il file imprese-bologna.html ESISTE, e
#    senza force Netlify servirebbe il file e salterebbe la regola. E' la
#    stessa trappola scritta piu' su per le regole del 404.
# ⚠️ status = 301 (non 302): a Google si dice che il trasloco e' definitivo,
#    se no continua a tenersi il vecchio indirizzo.
# ⚠️ Stanno DOPO le regole del 404 e prima di niente: nessuna delle due
#    famiglie tocca gli stessi indirizzi.
# ⚠️ Scritte una per una e non con un carattere jolly: il jolly di Netlify
#    prende tutto fino alla fine dell'indirizzo, quindi «/imprese-*» non sa
#    togliere il «.html» e si rimanderebbe da solo, all'infinito.
# ======================================================================


[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!docs/' ':!.gitignore' ':!*.sql'"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "echo 'Deploy preview disabilitato per risparmiare crediti'"

[context.branch-deploy]
  command = "echo 'Branch deploy disabilitato per risparmiare crediti'"

[[redirects]]
  from = "/gestionale"
  to = "/gestionale-invito.html"
  status = 302

[[redirects]]
  from = "/registrazione.html"
  to = "/#registrati"
  status = 301
  force = true

# Pagina Termini duplicata: unifichiamo tutto su /termini-condizioni
[[redirects]]
  from = "/termini-servizio"
  to = "/termini-condizioni"
  status = 301
  force = true

[[redirects]]
  from = "/termini-servizio.html"
  to = "/termini-condizioni.html"
  status = 301
  force = true

# Doppione: /ricerca-offerte faceva la stessa ricerca di /offerte-lavoro
[[redirects]]
  from = "/ricerca-offerte"
  to = "/offerte-lavoro"
  status = 301
  force = true

[[redirects]]
  from = "/ricerca-offerte.html"
  to = "/offerte-lavoro.html"
  status = 301
  force = true

# Sitemap delle offerte di lavoro: generata al volo dal database
[[redirects]]
  from = "/sitemap-offerte.xml"
  to = "/.netlify/functions/sitemap-offerte"
  status = 200

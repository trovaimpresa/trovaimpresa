[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!docs/' ':!.gitignore' ':!*.sql'"
  # ===== 16 agosto 2026 — IL CONTROLLO PRIMA DI PUBBLICARE =====
  # Gira a ogni push, PRIMA che il sito vada online. Se trova un link che
  # porta nel vuoto, uno <script> con un errore di sintassi, uno schema per
  # Google rotto o una regola del progetto saltata, la pubblicazione si
  # ferma e il sito online resta quello di prima.
  # Nasce da tre pulsanti che in due giorni hanno portato su pagine che non
  # esistevano. Cosa controlla e perche' e' scritto in tools/controllo-push.js.
  # Per spegnerlo in fretta, se un giorno dovesse dare fastidio: mettere un
  # cancelletto davanti alla riga qui sotto.
  command = "node tools/controllo-push.js"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "echo 'Deploy preview disabilitato per risparmiare crediti'"

[context.branch-deploy]
  command = "echo 'Branch deploy disabilitato per risparmiare crediti'"

[[redirects]]
  from = "/gestionale"
  to = "/gestionale-invito.html"
  status = 302

[[redirects]]
  from = "/registrazione.html"
  to = "/#registrati"
  status = 301
  force = true

# ===== 16 agosto 2026 — DUE PAGINE MORTE CHE FACEVANO 404 =====
# Trovate in Search Console. Nessuna pagina del sito le linka: chi ci arriva
# viene da fuori (vecchie email, o la memoria di Google).
# Il rinvio per "registrazione.html" c'era gia', ma quello SENZA .html era
# rimasto scoperto: Google lo visitava ancora il 2 agosto.
[[redirects]]
  from = "/registrazione"
  to = "/#registrati"
  status = 301
  force = true

# "disdetta.html" era il link per cancellarsi dalle email. Oggi quella pagina
# si chiama cancella-iscrizione.html. Un link di disdetta rotto e' la cosa
# peggiore da lasciare cosi': chi vuole andarsene deve poterlo fare.
[[redirects]]
  from = "/disdetta.html"
  to = "/cancella-iscrizione.html"
  status = 301
  force = true

[[redirects]]
  from = "/disdetta"
  to = "/cancella-iscrizione.html"
  status = 301
  force = true

# Pagina Termini duplicata: unifichiamo tutto su /termini-condizioni
[[redirects]]
  from = "/termini-servizio"
  to = "/termini-condizioni"
  status = 301
  force = true

[[redirects]]
  from = "/termini-servizio.html"
  to = "/termini-condizioni.html"
  status = 301
  force = true

# Doppione: /ricerca-offerte faceva la stessa ricerca di /offerte-lavoro
[[redirects]]
  from = "/ricerca-offerte"
  to = "/offerte-lavoro"
  status = 301
  force = true

[[redirects]]
  from = "/ricerca-offerte.html"
  to = "/offerte-lavoro.html"
  status = 301
  force = true

# Sitemap delle offerte di lavoro: generata al volo dal database
[[redirects]]
  from = "/sitemap-offerte.xml"
  to = "/.netlify/functions/sitemap-offerte"
  status = 200

# La bacheca candidature cambia indirizzo per essere coerente con /offerte-lavoro
[[redirects]]
  from = "/ricerca-candidati"
  to = "/candidature-lavoro"
  status = 301
  force = true

[[redirects]]
  from = "/ricerca-candidati.html"
  to = "/candidature-lavoro.html"
  status = 301
  force = true

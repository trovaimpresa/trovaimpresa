[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':!*.md' ':!docs/' ':!.gitignore' ':!*.sql'"
  # ===== 16 agosto 2026 — IL CONTROLLO PRIMA DI PUBBLICARE =====
  # Gira a ogni push, PRIMA che il sito vada online. Se trova un link che
  # porta nel vuoto, uno <script> con un errore di sintassi, uno schema per
  # Google rotto o una regola del progetto saltata, la pubblicazione si
  # ferma e il sito online resta quello di prima.
  # Nasce da tre pulsanti che in due giorni hanno portato su pagine che non
  # esistevano. Cosa controlla e perche' e' scritto in tools/controllo-push.js.
  # Per spegnerlo in fretta, se un giorno dovesse dare fastidio: mettere un
  # cancelletto davanti alla riga qui sotto.
  command = "node tools/controllo-push.js"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "echo 'Deploy preview disabilitato per risparmiare crediti'"

[context.branch-deploy]
  command = "echo 'Branch deploy disabilitato per risparmiare crediti'"

# ======================================================================
# 18 agosto 2026 — LA ROBA CHE NON DEVE STARE ONLINE
# ======================================================================
# `publish = "."` pubblica TUTTA la cartella, non solo le pagine. Quindi
# fino a oggi chiunque poteva aprire nel browser:
#   trovaimpresa.com/CLAUDE.md              (tutta la memoria del progetto)
#   trovaimpresa.com/sql/01-schema.sql      (schema del database e lucchetti)
#   trovaimpresa.com/netlify/functions/...  (il codice dei server)
#   trovaimpresa.com/reclutamento-lazio.csv (nomi, telefoni ed email veri)
#   trovaimpresa.com/backup/gestionale-app.backup-20260721.html
#
# Le chiavi non c'erano (stanno nelle variabili di Netlify), ma il resto
# si', ed era tutto scaricabile senza password.
#
# Queste regole rispondono "non trovata" su quegli indirizzi. Servono tre
# cose in ognuna, e vanno tutte e tre:
#   status = 404   -> risponde come una pagina che non esiste
#   force  = true  -> ⚠️ SENZA QUESTO NON SERVE A NIENTE: Netlify, se il
#                     file esiste davvero, serve il file e salta la regola
#   to = "/404.html" -> quello che si vede
#
# ⚠️ Stanno PRIME di tutte le altre apposta: Netlify tiene buona la prima
#    regola che combacia.
# ⚠️ NON tocca /.netlify/functions/... (col punto davanti), che e' l'indirizzo
#    vero da cui girano le funzioni. Quello deve continuare a funzionare.
# Il controllo al push guarda che questo elenco resti completo: se domani
# nasce una cartella o un file da tenere fuori e qui non c'e', si ferma.
# ======================================================================

[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backup/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BACKLOG.md"
  to = "/404.html"
  status = 404
  force = true

# ⚠️ 4 settembre 2026 — il quaderno dei lavori a meta'. Nato oggi in root, e
# il controllo prima di pubblicare l'ha visto subito e ha fermato il deploy.
# Dentro c'e' cosa e' rotto, cosa manca e dove si sta lavorando: la mappa
# esatta di dove bussare.
[[redirects]]
  from = "/LAVORI-APERTI.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/PROMPT-sessione-nuova.md"
  to = "/404.html"
  status = 404
  force = true

# ⚠️ 25 agosto 2026 — il gemello minuscolo del file qui sopra.
# `prompt-nuova-sessione.md` sta in root e dentro c'e' il racconto di come
# e' fatto il gestionale, cosa e' rotto e dove si lavora: il controllo prima
# di pubblicare l'ha visto e ha fermato il deploy, giustamente.
# ⚠️ I due nomi si somigliano ma sono due file diversi: servono tutti e due
#    i rinvii, uno non copre l'altro.
[[redirects]]
  from = "/prompt-nuova-sessione.md"
  to = "/404.html"
  status = 404
  force = true

